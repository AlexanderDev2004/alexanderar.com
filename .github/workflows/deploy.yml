name: Build & Deploy Static Site

on:
  push:
    branches:
      - master

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install
      - name: Install Pillow (OG image generator)
        run: python -m pip install pillow
      - name: Build (includes GitHub snapshot fetch + OG images)
        run: bun run build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Sync Last.fm API key (Worker secret for /api/lastfm)
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$LASTFM_API_KEY" ]; then
            echo "$LASTFM_API_KEY" | bunx wrangler@4 secret put LASTFM_API_KEY
          else
            echo "LASTFM_API_KEY not set in repo secrets — /api/lastfm will return 503 until it is added."
          fi

      - name: Deploy to Cloudflare Workers
        run: bunx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
